<div class="content-topbar">
  <div class="content-topbar-actions">
    <button
      type="button"
      class="nav-toggle"
      id="nav-toggle"
      aria-label="메뉴 열기"
      aria-expanded="false"
      aria-controls="site-sidebar"
      title="Menu"
    >
      <svg class="nav-toggle-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M4 7h16M4 12h16M4 17h16"/>
      </svg>
    </button>
    <button
      type="button"
      class="theme-toggle"
      id="theme-toggle"
      aria-label="테마 변경"
      title="Dark / Light mode"
    >
      <svg class="theme-toggle-icon theme-toggle-icon--sun" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
      </svg>
      <svg class="theme-toggle-icon theme-toggle-icon--moon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M21 14.5A8.5 8.5 0 1 1 9.5 3a6.5 6.5 0 1 0 11.5 11.5z"/>
      </svg>
    </button>
    <a
      href="mailto:{{ site.author.email }}?subject=Portfolio%20Inquiry"
      class="content-topbar-contact"
    >
      Contact
    </a>
  </div>
  <div class="site-search" id="site-search" data-index="{{ '/search.json' | relative_url }}">
    <label class="visually-hidden" for="site-search-input">사이트 검색</label>
    <input
      id="site-search-input"
      class="site-search-input"
      type="search"
      placeholder="Search…"
      autocomplete="off"
      spellcheck="false"
    >
    <div class="site-search-results" hidden></div>
  </div>
</div>

<script src="{{ '/assets/js/theme-toggle.js' | relative_url }}"></script>
<script src="{{ '/assets/js/mobile-nav.js' | relative_url }}?v=1"></script>
<script src="{{ '/assets/js/site-search.js' | relative_url }}?v=2"></script>
