{% comment %}
  Home Recent Poster — 최신 10개 (site.posts는 날짜 내림차순)
{% endcomment %}

<ul class="post-list post-list--cards poster-recent-list">
  {% for post in site.posts limit: 10 %}
    {% include poster-card.html post=post %}
  {% else %}
    <li class="poster-recent-empty">아직 등록된 Poster가 없습니다.</li>
  {% endfor %}
</ul>
