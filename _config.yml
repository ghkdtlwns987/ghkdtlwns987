title: Si June Hwang
description: >-
  LLM을 활용한 Software Engineering · AI 기반 소프트웨어 보안 연구
baseurl: "/ghkdtlwns987"
url: "https://ghkdtlwns987.github.io"

author:
  name: 황시준 (Si June Hwang)
  email: ghkdtlwns987@hanyang.ac.kr
  github: ghkdtlwns987
  velog: https://velog.io/@ghkdtlwns987
  tistory: https://pwnable-study.tistory.com

# GitHub Profile README는 Jekyll 빌드에서 제외
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .git
  - .gitignore
  - .github

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

timezone: Asia/Seoul
permalink: /poster/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

# 네비게이션
navigation:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Research
    url: /research/
  - title: Projects
    url: /projects/
  - title: Publications
    url: /publications/
  - title: Poster
    url: /poster/
