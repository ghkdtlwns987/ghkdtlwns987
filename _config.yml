title: "황시준 | Si June Hwang"
tagline: "LLM SE · AI Security"
description: >-
  LLM for Software Engineering, AI Security Researcher
baseurl: ""
url: "https://ghkdtlwns987.github.io"
lang: ko_KR
logo: /assets/images/1.png

author:
  name: 황시준 (Si June Hwang)
  email: ghkdtlwns987@hanyang.ac.kr
  github: ghkdtlwns987
  velog: https://velog.io/@ghkdtlwns987
  tistory: https://pwnable-study.tistory.com

# 공개되면 안 되는/불필요한 파일은 사이트에 올리지 않음
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .git
  - .gitignore
  - .github
  - pdf
  - "*.pdf"
  - figure/*.pdf
  - _private
  - _templates
  - bob.png
  - ho-dong.png
  - 1.png
  - .DS_Store

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

timezone: Asia/Seoul
permalink: /poster/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/1.png
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "pdf"
    values:
      sitemap: false
  - scope:
      path: "figure"
    values:
      sitemap: false
  - scope:
      path: "*.pdf"
    values:
      sitemap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml
  excerpt_only: false
  posts_limit: 20

# 네비게이션
navigation:
  - title: Home
    url: /
  - title: Research
    url: /research/
  - title: Publications
    url: /publications/
  - title: Projects
    url: /projects/
  - title: Blog
    url: /poster/
  - title: CV
    url: /about/

# 댓글 (Giscus — GitHub Discussions)
# 1) 저장소 Settings → Features → Discussions 활성화
# 2) https://github.com/apps/giscus 설치 (이 repo 선택)
# 3) https://giscus.app 에서 repo 입력 후 category / IDs 확인
# 4) 아래 category_id 채우고 enabled: true
giscus:
  enabled: true
  repo: ghkdtlwns987/ghkdtlwns987.github.io
  repo_id: R_kgDOJTHlkA
  category: Announcements
  category_id: "DIC_kwDOJTHlkM4DDWZQ"
  mapping: pathname
  reactions_enabled: 1
  input_position: bottom
  lang: ko

# 조회수 (Abacus 카운터 — 날짜 옆에 표시)
views:
  namespace: ghkdtlwns987-poster

# Google Analytics 4
google_analytics: G-VJZB5VZ89Y
