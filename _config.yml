title: Si June Hwang
description: >-
  LLM을 활용한 Software Engineering · AI 기반 소프트웨어 보안 연구
baseurl: "/ghkdtlwns987"
url: "https://ghkdtlwns987.github.io"

author:
  name: 황시준 (Si June Hwang)
  email: ghkdtlwns987@hanyang.ac.kr
  github: ghkdtlwns987
  velog: https://velog.io/@ghkdtlwns987
  tistory: https://pwnable-study.tistory.com

# GitHub Profile README는 Jekyll 빌드에서 제외
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - .git
  - .gitignore
  - .github

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

timezone: Asia/Seoul
permalink: /poster/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: "pdf"
    values:
      sitemap: false
  - scope:
      path: "figure"
    values:
      sitemap: false
  - scope:
      path: "*.pdf"
    values:
      sitemap: false

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

# 네비게이션
navigation:
  - title: Home
    url: /
  - title: About
    url: /about/
  - title: Research
    url: /research/
  - title: Projects
    url: /projects/
  - title: Publications
    url: /publications/
  - title: Poster
    url: /poster/

# 댓글 (Giscus — GitHub Discussions)
# 1) 저장소 Settings → Features → Discussions 활성화
# 2) https://github.com/apps/giscus 설치 (이 repo 선택)
# 3) https://giscus.app 에서 repo 입력 후 category / IDs 확인
# 4) 아래 category_id 채우고 enabled: true
giscus:
  enabled: true
  repo: ghkdtlwns987/ghkdtlwns987
  repo_id: R_kgDOJTHlkA
  category: Announcements
  category_id: "DIC_kwDOJTHlkM4DDWZQ"
  mapping: pathname
  reactions_enabled: 1
  input_position: bottom
  lang: ko

# 조회수 (Abacus 카운터 — 날짜 옆에 표시)
views:
  namespace: ghkdtlwns987-poster
