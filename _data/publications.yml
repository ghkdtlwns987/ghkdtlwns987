international:
  - slug: clear-ase-2026
    featured: true
    headline: "CLEAR: Causal Context-based Agentic Reasoning for Vulnerability Detection"
    title: "CLEAR: Causal Context-based Agentic Reasoning for Vulnerability Detection"
    date: "2026.07.29"
    venue: "IEEE/ACM International Conference on Automated Software Engineering (ASE 2026)"
    authors: "Sungju Yun*, Sijune Hwang*, Yeonjoon Lee, Kyungtae Kang, Sungbin Park"
    badges:
      - type: intl
        label: International
      - type: venue
        label: ASE
      - type: year
        label: "2026"
      - type: author
        label: First Author
    news:
      date: "Aug 2026"
      featured: true
      text: |
        CLEAR: Causal Context-based Agentic Reasoning for Vulnerability Detection has been accepted to
        IEEE/ACM International Conference on Automated Software Engineering (ASE 2026).
      badges:
        - New
        - Paper
      tags:
        - ASE
        - "2026"
    summary:
      - >
          소프트웨어 취약점의 복잡한 인과 관계를 구조화한 Vulnerability Causal Knowledge Graph (VCKG)와 LLM 기반 Multi-Agent Reasoning을 결합한 AI 기반 취약점 탐지 프레임워크를 제안하였습니다. 
          소프트웨어 취약점을 원인과 결과의 인과 관계로 모델링하여 그래프 형태의 보안 지식을 구축하고, LLM 추론과 결합한 새로운 접근법을 제시한 참신함을 인정받아, 본 연구는 IEEE/ACM International Conference on Automated Software Engineering (ASE 2026)에 채택되었습니다.
      - >
          본 연구에서는 Vulnerability Causal Knowledge Graph (VCKG)를 구축하고,
          다중 LLM 에이전트 기반 협력 추론을 통해 소프트웨어 취약점의 탐지와
          원인 분석을 수행합니다.
    link: "https://arxiv.org/abs/2608.03134"
    link_label: "http://arxiv.org/abs/2608.03134"
    contributions:
      - Multi-Agent 기반 취약점 탐지 프레임워크 제안
      - Vulnerability Causal Knowledge Graph (VCKG) 설계
      - LLM 기반 Multi-Agent Reasoning을 통한 취약점 탐지 성능 향상
    figures:
      - src: figure/paper/clear1.png
        caption: CLEAR 프레임워크 개요
      - src: figure/paper/clear2.png
        caption: VCKG 및 Multi-Agent Reasoning 구조

