# Blog 카테고리 — 이 파일만 수정하면 됩니다.
# 변경 후: ruby script/generate_poster_pages.rb
#
# algorithm 하위 카테고리 추가:
#   1) subcategories에 slug/title 추가 (중첩: bfs/dfs)
#   2) ruby script/generate_poster_pages.rb
#   3) _posts/algorithm/{slug}/ 또는 _posts/algorithm/bfs/dfs/ 에 글 작성
#
# 표시 이름은 Blog / Posts. URL 루트는 호환을 위해 /poster/ 유지.

categories:
  - slug: research
    title: Research
    description: 논문 리뷰와 연구 노트

  - slug: security
    title: Security
    description: 보안 취약점 분석 관련 글

  - slug: engineering
    title: Engineering
    description: 소프트웨어 엔지니어링, 시스템, 도구

  - slug: algorithm
    title: Algorithm
    description: 알고리즘, 코테 풀이
    subcategories:
      - slug: dp
        title: DP
      - slug: graph
        title: Graph
      - slug: bfs/dfs
        title: BFS · DFS
      - slug: greedy
        title: Greedy
      - slug: sort
        title: Sort
      - slug: hash
        title: Hash

  - slug: etc
    title: Etc
    description: 연구 생활, 회고, 기타 기록
