sections:
  - title: Security Research
    projects:
      - slug: unreal-fuzzing
        title: Unreal Engine Vulnerability Analysis with Fuzzing
        meta: BoB 10기
        summary: Fuzzing 기반 Unreal Engine 취약점 분석. RCE 2건, DoS 1건 · Bug Bounty $17,500.
        tags:
          - Fuzzing
          - AFL++
          - Clang/LLVM
          - Unreal Engine
          - label: C/C++
            style: green
          - label: Bug Bounty
            style: purple
        detail:
          summary:
            - >
                Epic Games Unreal Engine을 대상으로 대규모 퍼징(Fuzzing) 환경을 구축하고
                게임 엔진의 파일 파서와 네트워크 컴포넌트에 대한 보안 분석을 수행했습니다.
                UnrealBuildTool을 수정하여 AFL++ Instrumentation을 적용하고, 리소스 파일 및
                Pixel Streaming 기능을 대상으로 퍼징과 코드 감사를 병행하여 취약점을 분석했습니다.
                이를 통해 Remote Code Execution(RCE) 2건과 Denial of Service(DoS) 1건을
                발견하였으며, Epic Games Bug Bounty를 통해 총 $17,500의 리워드를 획득했습니다.
          role:
            - Unreal Engine 퍼징 환경 구축
            - AFL++ Instrumentation
            - Resource File / Pixel Streaming 취약점 분석
            - Code Auditing 및 PoC 작성
          achievements:
            - Unreal Engine 빌드 시스템 수정 및 퍼징 자동화
            - Resource File Parser 및 Pixel Streaming 공격면 분석
            - RCE 2건, DoS 1건 발굴
            - Epic Games Bug Bounty $17,500 획득
          tech:
            - C/C++
            - AFL++
            - Clang/LLVM
            - Unreal Engine
            - WinDbg / GDB
            - Linux

      - slug: malware-msa
        title: AI Malware Detector Platform
        meta: Capstone Design
        summary: AI 악성코드 탐지 MSA 플랫폼. Kubernetes · GitOps CI/CD · 모니터링 인프라 구축.
        tags:
          - AI
          - MSA
          - Kubernetes
          - Docker
          - label: GitOps
            style: green
        detail:
          summary:
            - >
                AI 기반 악성코드 탐지 서비스를 위한 통합 플랫폼을 개발한 캡스톤 프로젝트입니다.
                AI 기반 악성코드 탐지 엔진, Kubernetes 기반 클라우드 인프라, 웹 서비스로
                구성된 MSA(Microservice Architecture) 구조로 설계되었으며, Infrastructure
                파트를 담당하여 서비스 배포 및 운영 환경을 구축했습니다.
            - >
                Kubernetes 클러스터를 구성하고 애플리케이션을 컨테이너화한 뒤, Jenkins와
                ArgoCD를 활용한 GitOps 기반 CI/CD 파이프라인을 구축하여 코드 변경부터
                배포까지의 과정을 자동화했습니다. Prometheus와 Grafana를 활용한 모니터링
                환경과 Load Balancer를 적용하여 서비스의 안정성과 확장성을 확보했습니다.
            - >
                프로젝트를 통해 반복적인 배포 작업을 자동화하고 MSA 환경에서 효율적인
                운영 체계를 구축하는 경험을 쌓았습니다.
          role:
            - Kubernetes Master / Worker Cluster 구축
            - Docker 기반 서비스 컨테이너화
            - Jenkins · ArgoCD 기반 GitOps CI/CD Pipeline 구축
            - Prometheus · Grafana 모니터링 환경 구성
            - Kubernetes Load Balancer를 통한 서비스 운영 환경 구축
          tech:
            - Kubernetes
            - Docker
            - Jenkins
            - ArgoCD
            - GitHub
            - Prometheus
            - Grafana
            - Linux
          link: /assets/documents/capstone-final-report.pdf
          link_label: 캡스톤 최종발표.pdf

      - slug: hccc-incident-response
        title: HCCC 침해사고 대응
        meta: "2022"
        summary: 웹 서버 침해사고 디지털 포렌식 · 웹셸·백도어·권한 상승·SQL Injection 분석 및 대응.
        tags:
          - Digital Forensics
          - Apache
          - WebShell
          - SQL Injection
          - label: Dirty Pipe
            style: green
          - label: CVE-2022-0847
            style: purple
        detail:
          summary:
            - >
                웹 서버 침해사고를 대상으로 공격자의 침투 과정과 행위를 분석하고, 로그 및
                시스템 아티팩트를 기반으로 침해 원인을 규명하여 대응 방안을 수립한 디지털
                포렌식 프로젝트입니다. 웹셸 업로드부터 권한 상승, 백도어 설치, 데이터베이스
                조작까지 공격 전 과정을 분석하고 보안 조치를 수행하였습니다.
          role:
            - Apache, SSH, Web 로그 기반 침해사고 분석
            - WebShell 및 Reverse Shell 행위 분석
            - Apache Backdoor 모듈 식별 및 제거
            - Dirty Pipe(CVE-2022-0847) 기반 권한 상승 분석
            - SQL Injection 및 DB 조작 행위 분석
            - 시스템 복구 및 보안 강화 방안 수립
          achievements:
            - 웹셸, 백도어, 권한 상승, SQL Injection 등 주요 침해 행위를 성공적으로 식별
            - 공격 경로 및 침해 원인을 분석하여 대응 절차 및 시스템 보안 강화 방안 제시
            - 커널 업데이트, 백도어 제거, 방화벽 정책 적용 등 침해 대응 수행
          tech:
            - Linux
            - Apache
            - PHP
            - SQL
            - WebShell
            - Reverse Shell
            - Dirty Pipe
            - SQL Injection
            - Apache Log
            - Digital Forensics
          link: /assets/documents/hccc-final.pdf
          link_label: HCCC 최종.pdf

  - title: Engineering
    projects:
      - slug: k8s-msa
        title: Zero-Downtime Service Deployment Platform
        meta: Cloud Native Deployment Platform
        summary: EKS · GitOps · 무중단 Rolling Update · HPA 오토스케일링 MSA 배포 플랫폼.
        tags:
          - Kubernetes
          - AWS
          - Docker
          - ArgoCD
          - Jenkins
          - label: Spring Boot
            style: green
        detail:
          summary:
            - >
                중소 규모 조직에서도 복잡한 인프라 지식 없이 무중단(Zero-Downtime) 서비스를
                배포할 수 있도록 클라우드 네이티브 기반 자동 배포 플랫폼을 개발했습니다.
            - >
                서비스 개발자가 애플리케이션을 업로드하면 Docker 이미지 생성부터
                Kubernetes(EKS) 배포까지의 과정을 자동화하였으며, GitOps 기반 CI/CD 파이프라인을
                통해 서비스 업데이트와 버전 관리, 롤백을 지원하도록 설계했습니다. 또한 트래픽
                증가에 따라 Kubernetes의 오토스케일링 기능을 활용하여 서비스가 자동으로
                확장되도록 구현했습니다.
          role:
            - Backend · Cloud Infrastructure
          features:
            - Docker 기반 애플리케이션 컨테이너화
            - Amazon EKS 기반 Kubernetes 서비스 배포
            - Jenkins + ArgoCD 기반 GitOps CI/CD Pipeline 구축
            - Rolling Update 기반 무중단 서비스 배포
            - Kubernetes HPA를 활용한 Scale-Out / Scale-In
            - 서비스 장애 발생 시 이전 버전으로 Rollback 지원
            - Prometheus · Grafana 기반 모니터링 환경 구축
          extra_sections:
            - heading: Backend Development
              paragraphs:
                - MSA(Microservice Architecture) 구조를 기반으로 Front Server, Authentication Server, API Server를 설계·구현했습니다.
              groups:
                - title: Authentication Server
                  items:
                    - Spring Security + JWT 기반 인증/인가
                    - Redis를 활용한 로그인 세션 관리
                    - 토큰 만료 및 로그아웃 시 세션 자동 제거
                - title: API Server
                  items:
                    - 회원 CRUD 기능 구현
                    - Jenkins REST API를 이용한 빌드 및 배포 자동화
                    - 프로젝트 정보 관리 API 개발
                - title: Frontend Server
                  items:
                    - 서비스 배포 현황 및 운영 상태 시각화
            - heading: Cloud Infrastructure
              paragraphs:
                - AWS 기반 클라우드 환경을 구축하고 Kubernetes를 활용한 서비스 운영 환경을 설계했습니다.
                - Jenkins와 Docker Hub를 연동하여 애플리케이션을 자동 빌드하고 Kubernetes에 배포하는 GitOps 기반 CI/CD 환경을 구축했습니다.
              items:
                - Amazon EKS
                - Amazon ECR
                - Amazon RDS
                - AWS ALB
                - Route53
                - AWS Global Accelerator
            - heading: Challenges
              groups:
                - title: Jenkins 자동화
                  paragraphs:
                    - 사용자가 입력한 서비스 정보를 Jenkins Job으로 전달하는 과정에서 Jenkins XML Job Configuration 형식에 맞추어 REST API를 구현해야 했습니다.
                    - XML 기반 요청 생성 로직을 구현하여 Jenkins와 안정적으로 연동할 수 있도록 개선했습니다.
                - title: Shell Script 기반 배포 자동화
                  paragraphs:
                    - Jenkins에서 실행되는 Shell Script가 다양한 사용자 입력을 처리해야 했기 때문에 입력 검증과 예외 처리가 어려웠습니다.
                    - 스크립트를 모듈화하고 입력 검증 로직을 추가하여 다양한 서비스 환경에서도 안정적으로 YAML을 생성하도록 개선했습니다.
          achievements:
            - Kubernetes 기반 MSA 플랫폼 구축
            - GitOps 기반 CI/CD 자동화 구현
            - Rolling Update 기반 무중단 배포 구현
            - Kubernetes Auto Scaling 환경 구축
            - AWS 클라우드 서비스(EKS, ECR, RDS, ALB, Route53) 운영 경험
            - Jenkins REST API를 활용한 배포 자동화
            - Prometheus · Grafana 기반 모니터링 시스템 구축
          tech:
            - Kubernetes
            - Amazon EKS
            - AWS
            - Docker
            - ArgoCD
            - Jenkins
            - Prometheus
            - Grafana
            - Spring Boot
            - Spring Security
            - JPA
            - QueryDSL
            - REST API
            - Redis

      - slug: live-coding
        title: 교내 라이브코딩 플랫폼 구축
        meta: Live Coding Platform
        summary: Web · DB · Worker 인프라 구축 및 3년 운영. MySQL Replication 성능 개선.
        tags:
          - Linux
          - MySQL
          - PHP
          - Apache
          - label: Ubuntu
            style: green
        detail:
          summary:
            - >
                교내 프로그래밍 과제 및 중간·기말고사에서 활용되는 라이브 코딩 시스템의
                서버를 구축하고 약 3년간 운영했습니다.
            - >
                학생이 제출한 소스코드는 Worker 서버에서 컴파일 및 채점되며, 결과는
                Database를 통해 Web Server에 실시간으로 반영되는 구조입니다. 전체 인프라
                구축과 운영을 담당하며 서버 구축, 보안 정책 적용, 자동화, 유지보수 및
                성능 개선을 수행했습니다.
          extra_sections:
            - heading: Responsibilities
              groups:
                - title: Infrastructure 구축
                  items:
                    - Ubuntu 기반 서버 구축
                    - Web / Database / Worker 서버 구성
                    - SSL 적용 및 서비스 운영 환경 구축
                    - 서버 운영 및 장애 대응
                - title: Security
                  items:
                    - Firewall 정책 설계 및 적용
                    - Inbound / Outbound 트래픽 제어
                    - 웹 서비스 보안 정책 적용
                    - PHP 기반 웹 서비스 취약점 분석 및 수정
                - title: Automation
                  paragraphs:
                    - 운영 효율성을 높이기 위해 다양한 운영 자동화 스크립트를 개발했습니다.
                  items:
                    - Database 자동 백업
                    - 장애 발생 알림 시스템
                    - 서버 관리 자동화
                    - 운영 편의 스크립트 개발
            - heading: Performance Improvement
              paragraphs:
                - >
                    시험 기간에는 수백 명의 학생이 동시에 코드를 제출하면서 Database에
                    높은 부하가 발생했습니다. Worker 서버가 컴파일 결과를 Database에
                    기록하고 Web Server가 이를 조회하는 과정에서 Database 병목으로
                    Worker Manager 프로세스가 종료되는 문제가 발생했습니다.
                - >
                    서비스의 데이터 접근 패턴을 분석한 결과, 일반적인 웹 서비스와 달리
                    Read뿐 아니라 Update 작업의 비중도 매우 높다는 점을 확인했습니다.
                    MySQL Replication 구조를 도입하여 역할을 분리하고, 읽기 요청을
                    Slave로 분산하여 Database 부하를 크게 감소시켰습니다. 이를 통해
                    시험 기간에도 안정적으로 채점 서비스를 운영할 수 있었습니다.
              groups:
                - title: Master Database
                  items:
                    - INSERT
                    - UPDATE
                    - DELETE
                - title: Slave Database
                  items:
                    - SELECT
          achievements:
            - 교내 라이브 코딩 시스템 인프라 구축 및 약 3년 운영
            - 실제 중간·기말고사 및 프로그래밍 과제 운영 지원
            - Web / DB / Worker 서버 구축 및 운영
            - Firewall 및 SSL 기반 보안 강화
            - 서버 운영 자동화 스크립트 개발
            - PHP 기반 웹 서비스 유지보수 및 보안 취약점 개선
            - MySQL Replication을 활용한 Database 성능 개선 및 서비스 안정화
          tech:
            - Ubuntu
            - Linux
            - Apache
            - PHP
            - MySQL
            - SSL
            - Firewall

  - title: Education
    projects:
      - slug: sw-meister-security
        title: SW마이스터고등학교 정보보안 강사
        meta: 2022.01 – 2023.07
        summary: VMware 실습 환경 · 기능경기대회 대비 정보보안 교육 설계·운영.
        tags:
          - VMware
          - Linux
          - Web Security
          - label: Secure Coding
            style: green
          - label: 기능경기
            style: purple
        detail:
          summary:
            - >
                정보보안 특성화고 학생들을 대상으로 실무 중심의 정보보안 교육과
                기능경기대회 대비 커리큘럼을 설계 및 운영하였습니다. VMware 기반
                실습 환경을 구축하여 시스템 보안, 웹 보안, 보안 코딩, 정적 분석 등
                실습 위주의 교육을 진행하였습니다.
          role:
            - VMware 기반 정보보안 실습 환경 구축 및 운영
            - Linux 서버 보안(SSH, PAM, Firewall, DNS, SSL/TLS) 교육
            - Web Hacking(XSS, SQL Injection, File Upload 등) 실습 교육
            - Secure Coding 및 Java 보안 개발 교육
            - SpotBugs · FindSecurityBugs 기반 정적 분석 교육
            - 기능경기대회 대비 실전 문제 제작 및 모의 실습 운영
          achievements:
            - 정보보안 교육과정 설계 및 운영
            - 2022 사이버보안 지방·전국 기능경기대회 금·은·동·장려상 지도
            - 2023 사이버보안 국제기능올림픽 출전 선수 지도
          tech:
            - Linux
            - VMware
            - Apache
            - BIND9
            - iptables
            - WireGuard
            - PHP
            - Java
            - SpotBugs
            - FindSecurityBugs
            - DVWA
            - sqlmap
            - Burp Suite
